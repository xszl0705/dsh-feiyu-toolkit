# ComfyUI 外挂模型路径 —— 示例模板
#
# 用法：
#   1. 复制本文件为 extra-model-paths.yaml（同名去掉 .example）
#   2. 把 base_path 改成你自己 ComfyUI 整合包的位置
#   3. 启动 ComfyUI 时加：--extra-model-paths-config <本文件路径>
#
# 为什么要它：aki 整合包通常把模型放在 ComfyUI 目录**外面**——
#   <整合包>\模型\        底模（.safetensors）
#   <整合包>\controlnet\  ControlNet
# 不挂载的话，ComfyUI 自己的 models/ 是空的，一个模型都看不到。
#
aki:
  # ↓↓↓ 改成你的实际路径（正斜杠或反斜杠都行）
  base_path: C:/path/to/ComfyUI-aki
  checkpoints: 模型
  controlnet: controlnet

# ComfyUI 自带 models 目录继续生效（内置路径优先合并）
